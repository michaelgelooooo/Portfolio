<!doctype html>
<html lang="en">

<head>
	<meta charset="UTF-8" />
	<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />

	<title>Portfolio by Michæl</title>

	<script>
		try {
			var themes = { light: "wireframe", dark: "black" };
			var m = localStorage.getItem("theme");
			if (m !== "light" && m !== "dark") {
				m = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
			}
			document.documentElement.setAttribute("data-theme", themes[m]);
			document.documentElement.style.colorScheme = m;
		} catch (e) { }
	</script>

	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link
		href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=JetBrains+Mono&family=Outfit&display=swap"
		rel="stylesheet">

	<script src="https://kit.fontawesome.com/2462155d8a.js" crossorigin="anonymous"></script>
</head>

<body>
	<div id="root"></div>
	<script type="module" src="/src/main.jsx"></script>
</body>

</html>
